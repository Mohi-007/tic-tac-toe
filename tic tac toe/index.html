<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Animated Tic Tac Toe</title>
    <style>
      body {
        margin: 0;
        background: #121212;
        color: #fff;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      h1 {
        margin-bottom: 20px;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(3, 100px);
        gap: 10px;
        background: #1e1e1e;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 0 20px #0ff4, 0 0 60px #0ff2 inset;
      }

      .cell {
        background: #2a2a2a;
        border-radius: 10px;
        font-size: 3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s ease;
        user-select: none;
      }

      .cell:hover {
        transform: scale(1.05);
        background: #333;
      }

      .cell.x {
        color: #ff5050;
        animation: pop 0.3s ease;
      }

      .cell.o {
        color: #00aaff;
        animation: pop 0.3s ease;
      }

      .winner {
        background: #28a745 !important;
        animation: glow 1s infinite alternate;
      }

      @keyframes pop {
        0% {
          transform: scale(0);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes glow {
        from {
          box-shadow: 0 0 10px #0f0;
        }
        to {
          box-shadow: 0 0 30px #0f0;
        }
      }

      .status {
        margin-top: 20px;
        font-size: 1.5rem;
      }

      button {
        margin-top: 10px;
        padding: 8px 16px;
        background: #00aaff;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        background: #0077cc;
      }
    </style>
  </head>
  <body>
    <h1>🎮 Tic Tac Toe</h1>
    <div class="board" id="board"></div>
    <div class="status" id="status">Current Player: X</div>
    <button onclick="resetGame()">🔄 Restart</button>

    <script>
      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      let currentPlayer = "X";
      let board = Array(9).fill(null);
      let gameOver = false;

      const winPatterns = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      function createBoard() {
        boardEl.innerHTML = "";
        board.forEach((val, idx) => {
          const cell = document.createElement("div");
          cell.classList.add("cell");
          cell.dataset.index = idx;
          if (val) cell.classList.add(val.toLowerCase());
          cell.textContent = val || "";
          cell.addEventListener("click", handleClick);
          boardEl.appendChild(cell);
        });
      }

      function handleClick(e) {
        const index = e.target.dataset.index;
        if (board[index] || gameOver) return;

        board[index] = currentPlayer;
        createBoard();

        if (checkWin(currentPlayer)) {
          statusEl.textContent = `🎉 ${currentPlayer} Wins!`;
          gameOver = true;
          highlightWinningCells(currentPlayer);
        } else if (board.every((cell) => cell)) {
          statusEl.textContent = `It's a draw! 😐`;
          gameOver = true;
        } else {
          currentPlayer = currentPlayer === "X" ? "O" : "X";
          statusEl.textContent = `Current Player: ${currentPlayer}`;
        }
      }

      function checkWin(player) {
        return winPatterns.some((pattern) =>
          pattern.every((idx) => board[idx] === player)
        );
      }

      function highlightWinningCells(player) {
        winPatterns.forEach((pattern) => {
          if (pattern.every((idx) => board[idx] === player)) {
            pattern.forEach((idx) => {
              boardEl.children[idx].classList.add("winner");
            });
          }
        });
      }

      function resetGame() {
        board = Array(9).fill(null);
        currentPlayer = "X";
        gameOver = false;
        statusEl.textContent = `Current Player: ${currentPlayer}`;
        createBoard();
      }

      createBoard();
    </script>
  </body>
</html>
